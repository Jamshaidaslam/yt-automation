name: Automated Video Production Pipeline

on:
  schedule:
    # Slot 1: UTC 5:00 PM = USA 12:00 PM (Lunch) | UK 6:00 PM (Evening) | PK 10:00 PM ✅
    - cron: '0 17 * * *'
    
    # Slot 2: UTC 10:00 PM = USA 5:00 PM (Commute) | UK 11:00 PM | PK 3:00 AM ✅
    - cron: '0 22 * * *'

  workflow_dispatch:
    inputs:
      topic:
        description: 'Force a specific topic (Optional)'
        required: false
        default: ''
      skip_upload:
        description: 'Skip uploading to YouTube/Instagram (true/false)'
        required: false
        default: 'false'

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gTTS==2.5.1
          pip install -r requirements.txt

      - name: Orchestrate pipeline execution
        env:
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY:         ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:        ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_SECRET:  ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN_JSON:     ${{ secrets.YOUTUBE_TOKEN_JSON }}
          META_ACCESS_TOKEN:      ${{ secrets.META_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID:       ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_BUSINESS_ID:  ${{ secrets.INSTAGRAM_BUSINESS_ID }}
        run: |
          TOPIC="${{ github.event.inputs.topic }}"
          SKIP="${{ github.event.inputs.skip_upload }}"

          CMD="python main.py"
          if [ -n "$TOPIC" ]; then
            CMD="$CMD --topic \"$TOPIC\""
          fi
          if [ "$SKIP" = "true" ]; then
            CMD="$CMD --skip-upload"
          fi

          echo "Running: $CMD"
          eval "$CMD"

      - name: Archive Production Videos
        uses: actions/upload-artifact@v4
        if: always()  # Agar upload fail bhi ho jaye, tab bhi artifact build lazmi ho backup k liye
        with:
          name: compiled-shorts-${{ github.run_id }}
          path: |
            output/final_videos/*.mp4
            output/videos/*.mp4
            *.mp4
          if-no-files-found: warn
          retention-days: 7
