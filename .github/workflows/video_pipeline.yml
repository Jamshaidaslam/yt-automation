name: Automated Video Production Pipeline

on:
  schedule:
    - cron: '0 12 * * *'  # Video 1: Pakistan Time 5:00 PM (USA Morning / UK Lunch)
    - cron: '0 16 * * *'  # Video 2: Pakistan Time 9:00 PM (USA Mid-day / UK Evening)
    - cron: '0 21 * * *'  # Video 3: Pakistan Time 2:00 AM (USA Prime Time)
  workflow_dispatch:
    inputs:
      topic:
        description: 'Force a specific topic (Optional)'
        required: false
        default: ''
      skip_upload:
        description: 'Skip uploading to YouTube/Instagram (true/false)'
        required: false
        default: 'false'

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gTTS==2.5.1
          pip install -r requirements.txt

      - name: Orchestrate pipeline execution
        env:
          GROQ_API_KEY:              ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY:            ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:           ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_SECRET:     ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN_JSON:        ${{ secrets.YOUTUBE_TOKEN_JSON }}
          META_ACCESS_TOKEN:         ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID:     ${{ secrets.INSTAGRAM_BUSINESS_ID }}  # CRITICAL FIX: Matched with GitHub Secrets
          FACEBOOK_PAGE_ID:          ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          TOPIC="${{ github.event.inputs.topic }}"
          SKIP="${{ github.event.inputs.skip_upload }}"

          CMD="python main.py"
          [ -n "$TOPIC" ]        && CMD="$CMD --topic \"$TOPIC\""
          [ "$SKIP" = "true" ]   && CMD="$CMD --skip-upload"

          echo "Running: $CMD"
          eval "$CMD"

      - name: Archive Production Videos
        uses: actions/upload-artifact@v4
        if: always()  # Agar upload fail bhi ho jaye, tab bhi video backup save ho sake
        with:
          name: compiled-shorts-${{ github.run_id }}
          path: |
            output/final_videos/*.mp4
            output/videos/*.mp4
          if-no-files-found: warn
          retention-days: 7
