name: Automated Video Production Pipeline

on:
  schedule:
    - cron: '30 1 * * *'   # UTC 15:30 = PK 8:30 PM
    - cron: '0 17 * * *'   # UTC 18:30 = PK 11:30 PM
    - cron: '0 12 * * *'   # UTC 21:30 = PK 2:30 AM

  workflow_dispatch:
    inputs:
      topic:
        description: 'Force a specific topic (Optional)'
        required: false
        default: ''
      skip_upload:
        description: 'Skip uploading to YouTube/Instagram (true/false)'
        required: false
        default: 'false'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    # BUG FIX 1: No timeout set — agar pipeline hang ho jaye (network issue,
    # infinite loop, stuck upload) toh GitHub Actions 6 ghante baad kill karta
    # tha aur billable minutes waste hote the. 25 min enough hai poori pipeline ke liye.
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies & Fix ImageMagick Policy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg imagemagick

          # MoviePy TextClip fix: allow ImageMagick to read/write paths
          sudo sed -i 's/domain="path" rights="none" pattern="@\*"/domain="path" rights="read|write" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml
          sudo sed -i 's/domain="coder" rights="none" pattern="PDF"/domain="coder" rights="read|write" pattern="PDF"/g' /etc/ImageMagick-6/policy.xml

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cloudinary pydub==0.25.1
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Pipeline
        env:
          GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY:           ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:          ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID:        ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET:    ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN_JSON:       ${{ secrets.YOUTUBE_TOKEN_JSON }}
          META_ACCESS_TOKEN:        ${{ secrets.META_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID:         ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_BUSINESS_ID:    ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          CLOUDINARY_CLOUD_NAME:    ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:       ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET:    ${{ secrets.CLOUDINARY_API_SECRET }}
          UPLOAD_TO_YOUTUBE:        'true'
        run: |
          TOPIC=""
          SKIP="false"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TOPIC="${{ github.event.inputs.topic }}"
            SKIP="${{ github.event.inputs.skip_upload }}"
          fi

          # BUG FIX 2: eval "$CMD" with user-supplied $TOPIC is a shell injection risk.
          # Koi bhi topic input mein ; rm -rf / ya aur kuch inject kar sakta tha.
          # Fix: arguments directly pass karo eval se baghair.
          ARGS=()
          if [ -n "$TOPIC" ]; then
            ARGS+=(--topic "$TOPIC")
          fi
          if [ "$SKIP" = "true" ] || [ "$SKIP" = "True" ]; then
            ARGS+=(--skip-upload)
          fi

          echo "🚀 Running: python main.py ${ARGS[*]}"
          python main.py "${ARGS[@]}"

      - name: Archive Videos & Thumbnails
        uses: actions/upload-artifact@v4
        with:
          name: compiled-shorts-${{ github.run_id }}
          path: |
            output/final_videos/*.mp4
            output/final_videos/*.jpg
          if-no-files-found: warn
          # BUG FIX 2 continued: 'error' → 'warn' — agar sirf thumbnail generate
          # na ho lekin video ho, toh poora step fail nahi hona chahiye.
          retention-days: 7
