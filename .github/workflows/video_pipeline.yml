name: Automated Video Production Pipeline

on:
  schedule:
    # Slot 1: UTC 1:00 AM = PK 6:00 AM | USA 9:00 PM
    # 🔥 (YouTube Active + Meta Active) -> Video 1
    - cron: '0 1 * * *'
    
    # Slot 2: UTC 4:00 AM = PK 9:00 AM | USA 12:00 AM
    # 🚫 (Sirf Meta Active | YouTube SKIPPED) -> Video 2
    - cron: '0 4 * * *'

    # Slot 3: UTC 13:00 PM = PK 6:00 PM | USA 9:00 AM
    # 🔥 (YouTube Active + Meta Active) -> Video 3
    - cron: '0 13 * * *'

  workflow_dispatch:
    inputs:
      topic:
        description: 'Force a specific topic (Optional)'
        required: false
        default: ''
      skip_upload:
        description: 'Skip uploading to YouTube/Instagram (true/false)'
        required: false
        default: 'false'

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cloudinary
          pip install -r requirements.txt

      - name: Orchestrate pipeline execution
        env:
          GROQ_API_KEY:              ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY:            ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY:           ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_SECRET:     ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_TOKEN_JSON:        ${{ secrets.YOUTUBE_TOKEN_JSON }}
          META_ACCESS_TOKEN:         ${{ secrets.META_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID:          ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_BUSINESS_ID:     ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          CLOUDINARY_CLOUD_NAME:     ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:        ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET:     ${{ secrets.CLOUDINARY_API_SECRET }}
          
          # 🔥 NEW LOGIC: Agar schedule Slot 1 hai YA Slot 3 hai YA manual run kiya hai, to YouTube upload 'true' hoga.
          UPLOAD_TO_YOUTUBE:         ${{ (github.event.schedule == '0 1 * * *' || github.event_schedule == '0 13 * * *' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
          
        run: |
          TOPIC="${{ github.event.inputs.topic }}"
          SKIP="${{ github.event.inputs.skip_upload }}"

          CMD="python main.py"
          if [ -n "$TOPIC" ]; then
            CMD="$CMD --topic \"$TOPIC\""
          fi
          if [ "$SKIP" = "true" ]; then
            CMD="$CMD --skip-upload"
          fi

          echo "Running: $CMD"
          eval "$CMD"

      - name: Archive Production Videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiled-shorts-${{ github.run_id }}
          path: |
            output/final_videos/*.mp4
            output/videos/*.mp4
            *.mp4
          if-no-files-found: warn
          retention-days: 7
